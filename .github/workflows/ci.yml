name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ fromJSON(matrix.os.runner) }}
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        os:
          - name: ubuntu
            runner: '["self-hosted","Linux","X64","dushyantpc","home-linux-trusted"]'
          - name: macos
            runner: '"macos-latest"'
          - name: windows
            runner: '["self-hosted","Windows","X64","dushyantpc","home-windows-trusted"]'
        node-version: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - run: npm run build
      - run: npm test
        env:
          VITEST_POOL_TIMEOUT: 300000
      - name: Retry tests on failure (Windows flake)
        if: failure()
        run: npm test
        env:
          VITEST_POOL_TIMEOUT: 300000
